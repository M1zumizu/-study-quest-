<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="view-home">

    <!-- 🎮 ゲームヘッダー（Lv・XP表示） -->
    <header class="game-header">
        <h1>🎮 Study Quest</h1>
        <div class="status-container">
            <span id="levelDisplay">Lv. 1</span>
            <div class="exp-bar-container">
                <div id="expFill" class="exp-bar-fill"></div>
            </div>
            <span id="expText">0 / 100 XP</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- 🧭 サイドバー -->
        <nav class="sidebar">
            <div class="sidebar-item" id="menu-timer" onclick="showView('timer')">⏱️ タイマー</div>
            <div class="sidebar-item" id="menu-weakness" onclick="showView('weakness')">👾 苦手ノート</div>
            <div class="sidebar-item" id="menu-review" onclick="showView('review')">🔄 復習クイズ</div>
            <div class="sidebar-item" id="menu-achievement" onclick="showView('achievement')">🏆 アチーブメント</div>
            <div class="sidebar-item" id="menu-ranking" onclick="showView('ranking')">📊 週間ランキング</div>
            <div class="sidebar-item" id="menu-settings" onclick="showView('settings')">⚙️ 設定</div>
        </nav>

        <!-- 🖥️ メイン画面エリア -->
        <main class="content-area">

            <!-- ⏱️ タイマーカード -->
            <div id="card-timer" class="card" onclick="handleCardClick('timer')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>⏱️ 勉強タイマー</h2>
                <div id="timerDisplay" class="timer-number">00:00</div>
                <div class="timer-controls">
                    <button id="startBtn" onclick="startTimer(event)">スタート</button>
                    <button id="stopBtn" onclick="stopTimer(event)" style="display:none;">ストップ</button>
                </div>
            </div>

            <!-- 👾 苦手ノートカード -->
            <div id="card-weakness" class="card" onclick="handleCardClick('weakness')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>👾 苦手ノート</h2>
                <form onsubmit="addWeakness(event)" class="input-group">
                    <input type="text" id="weaknessInput" placeholder="苦手な問題や単語を入力">
                    <button type="submit">追加</button>
                </form>
                <div id="weaknessList" class="log-list"></div>
            </div>

            <!-- 🔄 復習クイズカード -->
            <div id="card-review" class="card" onclick="handleCardClick('review')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>🔄 復習クイズ</h2>
                <div class="quiz-box">
                    <p id="quizQuestionText">クイズを読み込み中...</p>
                    <div class="input-group">
                        <input type="text" id="userQuizAnswer" placeholder="回答を入力">
                        <button id="submitAnswerBtn" onclick="submitQuizAnswer(event)">回答する</button>
                    </div>
                    <p id="quizResultText" class="result-text"></p>
                </div>
                <button class="sub-btn" onclick="toggleQuizForm(event)">＋ 自作クイズを追加</button>
                <div id="quizFormContainer" style="display:none;" class="custom-quiz-form">
                    <form onsubmit="addCustomQuiz(event)">
                        <input type="text" id="customQuestion" placeholder="問題文を入力">
                        <input type="text" id="customAnswer" placeholder="正解を入力">
                        <button type="submit">保存</button>
                    </form>
                </div>
            </div>

            <!-- 🏆 アチーブメントカード -->
            <div id="card-achievement" class="card" onclick="handleCardClick('achievement')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>🏆 アチーブメント</h2>
                <div class="badge-grid">
                    <div class="badge-item" id="badge1">
                        <div class="badge-icon">🐣</div>
                        <div class="badge-name">最初の一歩</div>
                    </div>
                    <div class="badge-item" id="badge2">
                        <div class="badge-icon">🔥</div>
                        <div class="badge-name">集中マスター</div>
                    </div>
                    <div class="badge-item" id="badge3">
                        <div class="badge-icon">👑</div>
                        <div class="badge-name">伝説の勇者</div>
                    </div>
                </div>
            </div>

            <!-- 📊 週間ランキングカード -->
            <div id="card-ranking" class="card hidden" onclick="handleCardClick('ranking')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>📊 週間ランキング</h2>
                <div id="rankingDisplay">
                    <p style="color:var(--text-sub); font-size:0.85rem;">読み込み中...</p>
                </div>
            </div>

            <!-- ⚙️ 設定カード -->
            <div id="card-settings" class="card hidden" onclick="handleCardClick('settings')">
                <button class="back-btn" onclick="goBackToHome(event)">← 戻る</button>
                <h2>⚙️ 設定</h2>
                
                <div class="setting-item">
                    <label>ニックネーム</label>
                    <div class="input-group">
                        <input type="text" id="playerNameInput" placeholder="名前を入力">
                        <button onclick="savePlayerName(event)">保存</button>
                    </div>
                </div>

                <div class="setting-item">
                    <label>ランキング設定</label>
                    <p id="rankingStatus">現在：設定中...</p>
                    <div class="btn-group">
                        <button onclick="setRankingParticipation(true, event)">参加する</button>
                        <button onclick="setRankingParticipation(false, event)">参加しない</button>
                    </div>
                </div>

                <div class="setting-item">
                    <label>効果音</label>
                    <p id="soundStatus">現在：ON 🔊</p>
                    <div class="btn-group">
                        <button onclick="setSoundEnabled(true, event)">ON</button>
                        <button onclick="setSoundEnabled(false, event)">OFF</button>
                    </div>
                </div>

                <div class="setting-item danger-zone">
                    <button class="reset-btn" onclick="resetGameData(event)">データ全削除</button>
                </div>
            </div>

        </main>
    </div>

    <!-- 🔔 アチーブメント解放トースト通知 -->
    <div id="steamToast" class="steam-toast">
        <div class="toast-title">🏆 アチーブメント解除！</div>
        <div id="steamBadgeName" class="toast-body">---</div>
    </div>

    <!-- JavaScript読み込み -->
    <script src="script.js"></script>
</body>
</html>
